# .owned-paths.yaml
#
# Workspace-wide path ownership declaration for the Opal Capital multi-agent system.
# Used by the pre-commit hook (.tools/git-hooks/owned-paths-check.sh) to validate
# that committed paths match the declared --author agent's lane.
#
# SCHEMA: PRD §6.1 (docs/architecture/ADHC_OWNPTH.md)
# VERSION: 1
# DATE: 2026-04-24
# AUTHORED_BY: 1.0.0_SA_CTO
# COMP_LEARNS_HALF: reconstructed from PRD §6.1 schema (draft not present in ajb_workspace)
#
# ROLLOUT PHASE:
#   1 = warn-mode (fail-open): violations logged to org/git-author-override-audit.log, commit proceeds
#   2 = block-mode (fail-closed): violations EXIT 1 and block commit
#
rollout_phase: 2  # 2026-04-30: flipped to fail-closed per Andrew directive (TO 4 truncated by 24h, TO 5 shipping with this commit)
#
# UNMAPPED PATH HANDLING:
#   Any staged file that matches no glob below has lane: UNDEFINED.
#   Phase 1: WARN + audit-log entry, commit proceeds.
#   Phase 2: EXIT 1, commit blocked.
#   To authorize a legitimate commit to an unmapped path, use:
#     git commit --author-override LANE ...
#   which logs an OVERRIDE entry to org/git-author-override-audit.log.
#
# LONGEST-MATCH-WINS: more specific globs override broader ones.
#   paths are evaluated longest-match-first; order within file is documentation only.
#
# ESCAPE HATCH:
#   git commit --author-override LANE ...
#   Always logs to org/git-author-override-audit.log regardless of phase.

# =========================================================================
# LANES
# =========================================================================
lanes:

  BASE_EXEC:
    permitted_agents:
      - 1.0.0_SA_CTO
      - 2.0.0_SA_COO
    description: "Base workspace execs — CTO + COO (not project-scoped)"

  COMP_LEARNS:
    permitted_agents:
      - 1.1.0_SA_CTO
      - 2.1.0_SA_COO
      - 3.1.0_SA_CVO
      - 1.1.0_DS_CompLearns
      - 1.2.0_DS_CompLearns
      - 1.3.0_DS_CompLearns
      - 1.4.0_DS_CompLearns
      - 2.1.0_SC_CompLearns
    description: "Project-scoped COMP_LEARNS dyad (CTO + COO + CVO + all DS + SC)"

  ANY_EXEC:
