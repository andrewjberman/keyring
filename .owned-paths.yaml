  # Lane owners edit <status>/<evidence> after receipt. Both must be permitted.
  # ADHC_OWNPTH.005 false-positive fix 2026-04-30 — opens task_orders/*.md only.
  # -----------------------------------------------------------------------
  "org/tier1_exec/*/task_orders/*.md":
    lane: ANY_EXEC
    note: "Task orders into exec home folders — any exec may author (cross-exec dispatch)"

  "org/tier2_senior/0.1.0_*/task_orders/*.md":
    lane: POD1_OR_EXEC
  "org/tier2_senior/0.2.0_*/task_orders/*.md":
