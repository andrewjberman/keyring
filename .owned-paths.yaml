_CloudOps, 1.1.0_SA_CTO, 2.1.0_SA_COO, 3.1.0_SA_CVO, 4.0.0_SA_CRO), compared on BASE because base auto-permits tilde. THE PROGRAM'S PAGE ROSTER IS CLOSED (16 units; 12 certified, 1 in flight, 3 remaining), SO ENUMERATION TERMINATES AND IS NOT THE TREADMILL THE GRANTEE CORRECTLY OBJECTED TO -- it completes the grant across the remaining roster in one act instead of expiring per unit.** << >> **THE DISPLACEMENT IS REAL, CONTAINED, AND NAMED RATHER THAN GLOSSED: on these 3 new paths the same 8 base serials ARE revoked -- exercised, 0.7.0_AE_CloudOps and 4.0.0_SA_CRO~Z both REFUSED on all three. No displaced seat has a demonstrated need (none authors atom_decomp page runs; CRO~Z's W8 writes its own deliverables dir), so this is accepted rather than repaired -- BUT ANY DISPLACED SEAT THAT NEEDS A PAGE-RUN PATH IS ADDED ON ASK, and a future grantor must not read this acceptance as evidence the displacement did not occur.** << GATE EXERCISED BEFORE LANDING, both directions, per this lane's own rule that the control which catches a grant is the one confirming the INCUMBENTS: grantee DE~Z PERMITTED on all 3; incumbents CVO~Z (certifier -- writes certification.json), 0.5.0_AE_OpalETL~Z (author of W4c-2/W4c-4), CTO~Z (gate) and COO~Z (driver) PERMITTED on all 3; NEG control DE~Z on org/tier0/ledger/** REFUSED (harness discriminates); YAML re-validated 57 lanes / 244 path rules, all lane refs resolve. Landed by 1.0.0_SA_CTO~Z as GRANTOR (SoD: DE is grantee and did NOT self-land)."
