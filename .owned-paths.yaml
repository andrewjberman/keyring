  # `1.0.0_SA_CTO~C` needs no entry to commit wherever `1.0.0_SA_CTO` may.
  #
  # MECHANISM, source-confirmed at .tools/owned-paths-validate.py:125-160:
  # check_agent() tries an exact normalized match; ON MISS it strips ONE
  # trailing `_<alnum>` lane segment and re-tests. Deliberate, additive-only
  # (consulted only after exact-match failure, so it can never REVOKE), and
  # leak-free by construction (a true base serial strips to a non-serial that
  # matches nothing). RV-0030 F-003, ws CTO, 2026-06-08.
