# =========================================================================
# PATHS
# Listed roughly from most-specific to most-general within each top-level group.
# Longest match wins — more specific globs override broader ones at hook eval time.
# =========================================================================
paths:

  # -----------------------------------------------------------------------
  # Tier-0 governance framework (org/tier0/). Added 2026-05-22 by COO per
  # Andrew directive. Law docs = TIER0_LAW (Andrew-only / human commit);
  # operating artifacts = TIER0_MSTR; ratification records = TIER0_RATIFY.
  # -----------------------------------------------------------------------
  # GOVERNANCE AUDIT EVIDENCE BASE (Andrew-directed 2026-07-13; MSTR RV-0049 finding, CTO census+mechanism).
  # A census BY REMEMBERED NAME found 4 logs; a sweep BY PATTERN found 13 -- and the nine missed included
  # MASS-DELETION, SOVEREIGN-OVERRIDE, DEPLOY-BYPASS and HALT-GATE. They are SMALL *because* they record the
  # rarest acts, which is exactly why they were forgotten and exactly why they matter most.
