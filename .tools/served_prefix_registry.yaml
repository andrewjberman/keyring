schema_version: '0.1'
purpose: THE COVERAGE DENOMINATOR for S3Key graph ingest. Declares what the S3Key producer must cover
  so a served artifact can never be structurally invisible.
authority: Andrew-direct 2026-07-28. Step 1 of the comp-opalbizcluster reroute.
generated_by: .tools/gen_served_prefix_registry.py -- re-runnable; DEMAND from the canonical graph, SUPPLY
  from live S3. Nothing hand-listed.
method:
  demand: ServedURL nodes in the canonical graph (what the portal actually reads)
  supply: live list_objects_v2 over opal-data-portal-v2
  url_is_not_key: 'MEASURED: /api/general/mdpf/aggregate-aua-timeseries.json coexists with BOTH json/mdpf/aggregate-aua-timeseries.json
    AND json/mdpf/global/aggregate-aua-timeseries.json. The registry NEVER derives a key from a URL --
    it declares prefixes and lets the producer OBSERVE the keys.'
  dump_rule: keys_per_endpoint > 10 => KEYSET (a dump, declare served keys) else PREFIX (a served set,
    declare the prefix -- robust to key moves)
