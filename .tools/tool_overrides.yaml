doc: THE ONLY HAND-AUTHORED TOOL FIELDS. Everything else is derived by gen_tool_registry.py. Seeded from
  comp-coverage-map (concern) and graph-call-manifest (canonical_call) -- never invented.
tools:
  comp-adapter-audit:
    concern: portal ADAPTER field-threading audit vs LIVE S3 envelope (schema-drift / not-threaded / fallback-order)
    canonical_call: comp-adapter-audit <adapter-fn> [--severity warn|error]
  comp-assets:
    concern: 'OPAL_ASSETS monolith backfill COMPLETENESS census (V2-6) -- per channel folder of s3://opal-data-assets:
      per-layer object/byte counts, feed breakdown, date FRONTIER, 0-byte count, PLUS the channel''s own
      declared meta/backfill-status.json (frontier/completeness/counts/NAMED holes/guard verdict) rendered
      next to the listing so declared-vs-listed divergence is visible. A TOOL, not an alarm (no-alarms
      constraint; exit 0 on any census content)'
    canonical_call: comp-assets [--channel <source[/scope]>] [--probe] [--json]
  comp-aws:
    concern: the ENGINE that derives the cloud graph (17 node classes; IAM-as-graph-nodes; the LIVE half
      of the desired-vs-live overlay). Run ESTATE-SIDE by the nightly Fargate derive-runner and the
      incremental updater -- DEPRECATED for agent use 2026-09-09 (NFRA_CLDGRPH CG-s-30, R14a PRD v0.12
      @b77a6c3a27); read the result with comp-kuzu
    canonical_call: 'comp-kuzu "<Cypher>"    # comp-aws is DEPRECATED for agent use; the engine runs in the nightly derive-runner'
  comp-axes:
    canonical_call: comp-axes [--axes a,b] [--no-snapshot] [--json]
  comp-blast:
    concern: downstream IMPACT set + upstream callers (what breaks if I change X; function-level)
    canonical_call: comp-blast <fn-or-arn> [--function name] [--check-consumers]
  comp-build:
    canonical_call: comp-build [--check]
  comp-cache:
    concern: React-Query cache-KEY collision detection (shared key -> type-mismatch break)
    canonical_call: comp-cache collisions ; comp-cache key <substring>
  comp-chainrun:
    concern: ATOMIC-BUNDLE gold snapshot/diff (pre/post chain re-run -- DROPPED/COLUMNS-LOST/EMPTIED partial-refactor
      leak; VALGATE Class-B)
    canonical_call: comp-chainrun snapshot --label <L> ; comp-chainrun diff <A> <B>
  comp-clobber:
    concern: output-key COLLISION -- 2+ DISTINCT producers writing ONE sink (an S3 key / DDB table); the
      two-writers-one-key clobber where a stale/deprecated producer overwrites a fresh one (the 2026-07-21
      aum-timeseries freeze class)
    canonical_call: 'comp-clobber [--min-writers N] [--include-partitioned] [--json]   # static candidate
      scan; comp-clobber --sweep BUCKET PREFIX = the LIVE oracle (interleaved etag-lineage across every
      key under a prefix); comp-clobber --live BUCKET KEY = one key'
  comp-cluster:
    concern: page-rooted PAGE->PANEL->DRILLDOWN cluster structure + per-cluster data-sources + cross-panel
      SHARES_SOURCE coupling (NFRA_TSGRAPH P2-3; read-side peer of comp-cache, generalizing cache-key
      collisions to the 6-source coupling superset; queries the LIVE canonical graph, Rule 20)
    canonical_call: 'comp-cluster AdvisorIntelligence    # panel->drilldown tree + per-cluster sources
      + cross-panel coupling

      comp-cluster --list                 # every page + cluster counts + coverage

      comp-cluster --coverage             # page-tree coverage (assigned/total, visible unresolved named)

      comp-cluster <Page> --json          # structured

      '
  comp-constants:
    concern: marker/firm-CONSTANT drift vs canonical config (rep_id sweeps, FIRM_ID, AUA bounds; pre-commit
      gate)
    canonical_call: comp-constants check [--lane bd|inf|cot|multifirm] ; comp-constants new
  comp-coverage:
    canonical_call: comp-coverage <args>
  comp-dataflow:
    concern: 'value-ORIGIN / canonical-source lineage -- does a producer read a SERVED (platinum/served/portal-json)
      artifact as a value source? The layer grammar running BACKWARDS (RF-7: 49F counts sourced from platinum,
      no canonical per-date source). The QUERY form (origin) + the PSTMRT item-9 GATE form over ONE traversal'
    canonical_call: comp-dataflow origin <script.py> ; comp-dataflow gate <path ...>
  comp-deadgrant:
    canonical_call: comp-deadgrant [<lambda|role>]
  comp-debris:
    canonical_call: 'comp-debris [--types ddb|s3|ec2|events] [--days 30] [--hot-days 7]   # default --types
      lambda'
  comp-denytest:
    canonical_call: comp-denytest <plan|change-spec>
  comp-depth:
    concern: 'DEPTH-scoped graph querying (NFRA_GRAPHDEPTH P3) -- scope a traversal to a declared grain:
      drill coarse->fine + rollup fine->coarse EXISTENTIAL over the RUNS/CONTAINS/OWNED_BY strata (drilldown_seams-derived),
      grain-scoped node sets, and a breadth blast SCOPED to a grain. The DEPTH coordinate composed with
      BREADTH on the ONE marker-head handle (comp_marker_read.py); grain-calibrated by grain_contract,
      SIZE-INVARIANT (--to/--grain, never a type fork). DISTINCT from comp-kuzu (raw Cypher, any query)
      + comp-blast (breadth IMPACT set) + comp-trace (dependency PATH) -- comp-depth owns the grain/DEPTH
      scope'
    canonical_call: comp-depth grains <node-id> | scope <grain> | drill <node-id> --to <grain> | rollup
      <node-id> --to <grain> | blast <node-id> --grain <g>
  comp-describe:
    canonical_call: 'comp-describe <arn-or-name> [--json]   # find + describe ONE resource off the derive-at-scan
      engine'
  comp-diff:
    concern: map git/uncommitted CHANGES to graph blast radius (pre-commit/post-pull/pre-deploy)
    canonical_call: comp-diff [--staged | --ref HEAD~3]
  comp-dispatch:
    concern: 'gold-dispatch orchestration-DAG -- which scripts run / in what order / under which chain-group-flag
      / past which gate (freshness/resume-skip/incremental); firm-parameterized (data/<firm>/scripts/gold).
      NFRA_COMPROUTE S1 #1; fronts the previously-empty orchestration grain; COMPOSES with comp-pipescript
      (drill chain -> per-script io)'
    canonical_call: comp-dispatch <firm> [--chain <name> | --script <ID> | --gates | --undispatched] |
      comp-dispatch --list
  comp-drift:
    concern: structural-cruft / abandonment DISPOSITION over the propagation seams (edges-that-go-nowhere,
      old duplicated channels, deprecated outputs) -- the resource-STATE verb of NFRA_COMP*
    canonical_call: comp-drift coverage
  comp-dups:
    concern: estate DUPLICATE/dead-resource census (4 classes CROSS_FIRM/IAM_POLICY_SPLIT/SERVICE_SPLIT/ENV_TWIN
      + dual-evidence dead-confirm)
    canonical_call: 'comp-dups [--class CROSS_FIRM|IAM_POLICY_SPLIT|SERVICE_SPLIT|ENV_TWIN] [--json]   #
      on-demand scan of the canonical graph; comp-dups --nightly = the post-derive ledger-write mode ->
      org/modules/graph/debtscan/YYYY-MM-DD_DUPS_candidates.json + dups_latest.json pointer'
  comp-fedobs:
    canonical_call: comp-fedobs coevolution | comp-fedobs
  comp-firmsep-sweep:
    canonical_call: comp-firmsep-sweep <firm> [--write-reach]
  comp-freshness:
    concern: pipeline-DATA S3/DDB freshness -- is upstream fresh enough to run a gold chain? (the gold-run-readiness
      gate)
    canonical_call: comp-freshness chain {bd|inf|cot} ; comp-freshness script <id>
  comp-genesis:
    canonical_call: comp-genesis {new <c> | validate <c> | up --dry-run <c> | verify --local <c> | selftest
      | status <c>}
  comp-gitdrill:
    canonical_call: comp-gitdrill <node|file> [--at <ref> [--diff]]
  comp-graph:
    concern: graph-cache VINTAGE/freshness across the derived models (local trace caches + cloud artifacts)
      + clear
    canonical_call: 'comp-graph status [--json]   # comp-graph clear <platinum|trace|all> drops a cache'
  comp-heat:
    concern: estate-OBJECT write-freshness + uncommitted-write drift (repo files; hot/warm/cold + archive
      candidates)
    canonical_call: comp-heat freshness [path] [--half-life N] [--top N] [--json]
  comp-honesty:
    concern: honesty/completion GATE over the GOV-A invariants (I1 honest-missing / I2 measure-per-case
      / I3 control-fires-when-exercised); claim+evidence (or --file src.py) -> per-invariant PASS/FAIL/N-A,
      makes NFRA_SEMCTL_HONESTY_INVARIANTS.md runnable (N-A is LOUD, never a silent pass)
    canonical_call: comp-honesty <case.json> | comp-honesty --file <src.py> [--evidence <ev.json>] | comp-honesty
      --self-test
  comp-iam:
    concern: grant-analysis -- boto3 calls vs IAM grants (permission gaps; who-can-do-what; the DESIRED/source
      half + `reconcile` overlay)
    canonical_call: 'comp-iam gaps   # or: comp-iam service <lambda> | comp-iam role <name>'
  comp-iam-usage:
    canonical_call: comp-iam-usage {role-cold | who-can-reach <arn> | reach-check <role> <action> <arn>
      | limits}
  comp-icedrill:
    canonical_call: comp-icedrill s3://bucket/prefix/ | s3://bucket/key.json | ddb <table> | graph <node>
  comp-incrparity:
    concern: INCREMENTAL BD-pipeline parity (incremental cache vs full-recompute oracle)
    canonical_call: comp-incrparity <args>
  comp-keys:
    concern: 'S3 INVENTORY -- WHAT EXISTS under a prefix: arbitrary-prefix key enumeration, per-prefix
      partition-date enumeration (earliest/latest/gaps), per-firm existence. Live s3api, explicit-Z, denominator-always.
      Closes the aws_freshness rail-override class (268 entries whose intent was key/partition discovery,
      not freshness). NFRA_MSBEFF.R5'
    canonical_call: comp-keys prefix <bucket|s3://bucket/prefix> ; comp-keys partitions <bucket/prefix>
      ; comp-keys exists <suffix>
  comp-kuzu:
    concern: cross-surface federated READ -- Cypher over the loaded estate graph (the FAST default read-path)
    canonical_call: 'comp-kuzu "MATCH (n:CloudNode) WHERE n.node_type=''LAMBDA'' RETURN n.id, n.name LIMIT
      50"

      '
  comp-kuzu-full:
    canonical_call: 'comp-kuzu-full [--json] [--limit N] "<Cypher>"   # forces a FULL kuzu_nessie_load
      unconditionally, then serves the query'
  comp-kuzu-inc:
    canonical_call: 'comp-kuzu-inc [--json] [--limit N] "<Cypher>"   # incremental-OR-serve-labeled-stale
      (Andrew O-1 / sec-4 hard gate), then serves the query'
  comp-lambdamap:
    concern: DEPLOY-SHA parity -- source-map record == live CodeSha256 == S3-artifact sha (3-leg); lambda-source-map
      drift
    canonical_call: comp-lambdamap <args>
  comp-learns-score:
    canonical_call: comp-learns-score [--top N] [--file-candidates] [--goodhart-audit] [--json]
  comp-learns-status:
    canonical_call: comp-learns-status [gap_heat|coverage_gaps|tool_demand|...] [--json]
  comp-ontolint:
    canonical_call: comp-ontolint {check | self-test}
  comp-parity:
    concern: DATA/served parity -- can the canonical pipeline STAND IN for the BD-served surface? (never-widen
      cutover; multi-day CLEAN streak)
    canonical_call: 'comp-parity [firm] [--config data/canonical/schwab/parity/{firm}_parity_config.yaml]
      [--json]   # default firm: 49f'
  comp-pii:
    concern: PII EXPOSURE audit (routes + components; hashed vs cleartext; pseudonymizer coverage)
    canonical_call: comp-pii audit ; comp-pii scan <Component>
  comp-pipescript:
    concern: gold-script DAG -- intra-pipeline I/O (reads/writes), chains, column-gaps, portal consumers
      (the `deployed` subcmd serves seam-2)
    canonical_call: comp-pipescript <io|dag|chain|feeds|consumers|deployed|overlap> <script>
  comp-platinum:
    concern: full-stack component->gold COMPOSITION trace (page/reverse/tab-audit; firm-aware; chains
      transform+routes+pipescript)
    canonical_call: 'comp-platinum page <Component> --firm <bd|inf|cot>   # ADVI is firm-isolated'
  comp-pulse:
    canonical_call: 'comp-pulse [--days 7] [--top 8] [--json]   # exit 1 = the immune response is FIRING
      (a held node is under active traffic)'
  comp-pydeps:
    canonical_call: comp-pydeps consumers <name> | comp-pydeps deps <name> | comp-pydeps egress [<name>]
  comp-registry:
    canonical_call: comp-registry sync ROW=N | --project CODE | --all
  comp-routes:
    concern: CloudFront->origin->Lambda SERVING path (behaviors/origins/rewrites/auth-map; 4xx/HTML-mask
      debugging)
    canonical_call: comp-routes trace <url|endpoint> | comp-routes behaviors
  comp-secrets:
    concern: Secrets-Manager lens -- inventory (firm-tagged + rotation) + SAFE redacted read + secret->consumer
      map
    canonical_call: comp-secrets list [--firm bd|cot|inf|mdpf|opal|shared] [--json] ; comp-secrets get
      <name|arn> [--reveal] ; comp-secrets consumers <name|arn> ; comp-secrets rotation
  comp-shell:
    concern: Rule-16 bare-util scan in new .sh (Git-Bash-3.6.7-missing pgrep/pkill/flock/pidof/setsid/wget)
    canonical_call: comp-shell scan [path ...]
  comp-similar:
    canonical_call: 'comp-similar <arn-or-name> [<arn-or-name>] | supersede [--heat-json F | --live-heat]
      | cluster [--type T] [--json]   # functional-similarity / supersede scan off the summary corpus'
  comp-state:
    canonical_call: 'comp-state [--project CODE] [--days N] [--all] [--json]   # drift-only by default;
      --self-test MUST pass 3/3 before trusting a report'
  comp-symbols:
    concern: 'file-symbol INVENTORY -- what functions/classes/constants/imports a source file DEFINES
      + where (forward AST enumeration, input=a FILE). NFRA_COMPROUTE S1 #2; fronts the previously-empty
      file-symbol-inventory grain; COMPOSES with comp-blast (comp-symbols --grep -> pick a fn -> comp-blast
      it)'
    canonical_call: comp-symbols <file> [--grep <pattern>] [--kind func|class|const|import] [--json]
  comp-system:
    canonical_call: 'comp-system  (writes infra/system/06_current_state.{md,json}) ; comp-system --stdout
      ; comp-system --json ; comp-system --check (auto-refresh oracle: STALE vs HEAD-advance) ; comp-system
      --self-test'
  comp-tool-health:
    canonical_call: comp-tool-health [<tool>] [--json]
  comp-toolgraph:
    canonical_call: comp-toolgraph [--json]
  comp-tooltip:
    concern: tooltip MIGRATION/coverage audit (inline vs <DataTooltip> canonical; one-off sprint tool)
    canonical_call: comp-tooltip <args>
  comp-trace:
    concern: bidirectional dependency PATH walk from any repo node (where does data come/go -- up/down/both)
    canonical_call: comp-trace <node> --direction both [--depth N]
  comp-transform:
    concern: React component field-RENDER schema-check (MISSING=runtime-undefined / UNUSED=waste; ternary-audit
      for new cohorts)
    canonical_call: comp-transform schema-check <Component> [--feature <token>] ; comp-transform ternary-audit
      <Component>
  comp-trigger:
    canonical_call: comp-trigger <name-or-target-substring> [--days 7] | comp-trigger --list
  comp-types:
    concern: TS TYPE consumers/blast/fields before editing a shared type
    canonical_call: comp-types index <TypeName> [--firm-conditional-sites]
  comp-validate:
    concern: gold-artifact INVARIANT validation pre-upload (key_present/count_min/sum_approx/...; the
      no-crash-but-wrong-output gate)
    canonical_call: comp-validate <script_id> --artifact <local/path>
  comp-which:
    canonical_call: 'comp-which "<your natural-language question>"   # e.g. comp-which "what produces
      canonical_prices.parquet?"'
  comp-whoread:
    canonical_call: comp-whoread <bucket>[/prefix] [--since ...]
  comp-xray:
    concern: value-MOTION -- is the CONTENT genuinely changing or frozen-but-fresh? (code/config/schema/served-key
      motion lens)
    canonical_call: comp-xray frozen <bucket> <key> --fields total_aua,total.aua [--cadence-days N] [--json]
  comp-xref:
    concern: SYMBOL cross-ref across graph nodes/edges + graph-state diff-vs-baseline
    canonical_call: comp-xref <symbol>
