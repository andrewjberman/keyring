schema_version: '0.1'
authority: Andrew-direct 2026-07-28 -- standardized constants for tool classification
generated_by: .tools/gen_tool_classification.py (re-runnable; derived from source, not asserted)
population_authority: 'org/modules/graph/comp-coverage-map.yaml -- tools[] + meta_tools[] (CTO ruling
  20260728T212335Z, the SOLE population authority). READ through gen_tool_registry.population_from_map(),
  never re-implemented here. org/tier1_exec/3.0.0_SA_CVO/deliverables/tool_profile.json is the ATTRIBUTE
  source ONLY: a profile row whose tool is absent from the authority is EXCLUDED and NAMED on stdout,
  and an excluded name that is not a declared retired alias is reported as a finding. Before NFRA_CLDGRPH
  CG-s-17 (2026-09-09) the profile was also the population, and the four retired names it still carries
  made gen_tool_registry refuse outright.'
source_of_truth_note: 'This file classifies HOW a tool retrieves and what it covers. Tool INVENTORY (which
  tools exist + their one home) remains org/modules/graph/comp-coverage-map.yaml per CTO ruling #1. This
  does NOT supersede it and must not duplicate its fields.'
constants:
  state:
  - LIVE
  - PERSISTED
  state_doc: WHERE THE ANSWER COMES FROM. LIVE = established at call time. PERSISTED = read from a store
    built earlier. ONLY PERSISTED CAN BE STALE.
  derived:
  - true
  - false
  derived_doc: A QUALIFIER ON state, NOT A STATE (Andrew-direct). derived=true means computed from a more
    primitive source; false means read/authored directly. PERSISTED+derived needs a REFRESH MECHANISM;
    PERSISTED+authored needs an AUTHORSHIP GATE.
  denominator_construction:
  - ENUMERATED
  - MATCHED
  - TRAVERSED
  - EXERCISED
  - INHERITED
  denominator_construction_doc: 'HOW THE POPULATION IS BUILT. ENUMERATED = listed from an authoritative
    source, you get the whole set. MATCHED = discovered by pattern/search, you get HITS and never the
    set. TRAVERSED = walked from a seed, depth-dependent. EXERCISED = probed candidate-by-candidate against
    the live plane. NOTE: a bounded/unbounded BOOLEAN was tried first and measured VACUOUS (true for 89/89)
    -- a field that cannot vary is not a classification.'
  denominator_knowable_up_front:
  - true
  - false
  denominator_knowable_doc: 'Derived from construction: can the tool state N-of-M BEFORE it scans? ENUMERATED
    and EXERCISED yes; MATCHED and TRAVERSED no. THIS IS THE TRUNCATION-RISK AXIS -- a tool that cannot
    know its denominator cannot honestly report showing-N-of-M.'
  control_established:
  - POSITIVE
  - NEGATIVE
  - NONE
  control_doc: POSITIVE = can concretely show what IS covered. NEGATIVE = can also establish what is NOT
    there (only SIMULATE achieves this today -- it exercises rather than reads). NEGATIVE archetyping
    is the goal; POSITIVE is the floor and is enough to start.
known_limitations:
  universe_and_denominator_construction_are_PRECEDENCE_PICKED: 'A tool matching MULTIPLE primitives gets
    `universe` and `denominator_construction` from the PRECEDENCE-WINNING primitive, which is NOT always
    its dominant behaviour. Worked defect: comp-heat matches [GIT, SQL/TRINO] and is labelled with the
    Trino universe, but its true universe is GIT (object_freshness.py:46 ls-files). MEASURED BLAST RADIUS:
    67 of 89 tools (75%) are multi-primitive -- so treat `universe` as RELIABLE only for the 22 single-primitive
    tools. v0.2 fix: make `universe` and `denominator_construction` LISTS, one per primitive, since a
    multi-primitive tool genuinely has more than one universe.'
  fields_NOT_affected: '`state` (PERSISTED dominates -- if ANY read is from a store, staleness is a real
    question), `excludes` (UNIONED across all primitives, so it accumulates conservatively in the SAFE
    direction), and `control_established` (strongest across primitives) are sound for multi-primitive
    tools.'
  classification_is_DECLARED_from_source: 'Derived by source-pattern match, NOT by execution. A primitive
    reached only on a rare code path may be mis-binned. Exercised for: comp-heat, comp-clobber, comp-coverage-check,
    comp-which, comp-grep, comp-glob.'
  negative_control: Only EXERCISED (SIMULATE) tools can establish absence. 8 of 89 today. For the other
    81, POSITIVE control is the floor and is what is claimed -- per Andrew-direct, that is enough to start.
