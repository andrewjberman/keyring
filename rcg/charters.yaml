# rcg/charters.yaml v2 -- per-root grammars as TWO ORTHOGONAL MECE FIELDS (R-0009 postulate-iii
# remediation of the v1 single-enum, which conflated what-a-subtree-IS with how-RCG-HANDLES-it;
# ratified law: one classification axis serves ONE intent).
#   content:  code | registry | doctrine | record | workproduct | data | mixed
#             (what the subtree IS -- grain: subtree; residual: mixed, loud)
#   handling: SCORE | protect | append_only | exclude
#             (what RCG DOES -- grain: subtree; protected = handling != score)
# v1 -> v2 mapping is lossless: LIVE_CODE=(code,score) GOVERNED_REGISTRY=(registry,score)
# DOCTRINE=(doctrine,protect) APPEND_ONLY_RECORD=(record,append_only)
# WORKPRODUCT_ARCHIVE=(workproduct,score) SCRATCH=(workproduct,score -- orphan-ness is a
# FEATURE not a charter) PROTECTED_LIVE_CORE=(code,protect) DATA_TREE=(data,score)
# EXCLUDED=(mixed,exclude). Ratified v1 verdicts preserved; only the axes unbundled.
version: 2
content_values: [CODE, REGISTRY, DOCTRINE, RECORD, WORKPRODUCT, DATA, MIXED]
handling_values: [SCORE, PROTECT, APPEND_ONLY, EXCLUDE]

root_set:   # marking grows from here; vintage-weighted (the unmarked never confer life)
  - CLAUDE.md
  - org/XXX.md
  - .claude/
  - .tools/
  - org/mcp/server.py
  - org/mcp/inbox-watch.sh
  - infra/aws/lambda/ci/lambda-source-map.json
  - infra/aws/terraform/
  - .github/
  - org/projects/
  - MEMORY.md

charters:
  # org
  org/:                             { content: WORKPRODUCT, handling: SCORE }
  org/mcp/:                         { content: CODE,        handling: SCORE }
  org/modules/:                     { content: REGISTRY,    handling: SCORE }
  org/projects/:                    { content: REGISTRY,    handling: SCORE }
  "org/*/logs/":                    { content: RECORD,      handling: APPEND_ONLY }
  "org/**/logs/":                   { content: RECORD,      handling: APPEND_ONLY }
  org/mcp/inbox/:                   { content: RECORD,      handling: APPEND_ONLY }
  "org/**/task_orders/":            { content: RECORD,      handling: APPEND_ONLY }
  "org/**/handoffs/":               { content: RECORD,      handling: APPEND_ONLY }
  org/tier0/ledger/:                { content: RECORD,      handling: APPEND_ONLY }
  org/audit/:                       { content: RECORD,      handling: APPEND_ONLY }
  org/critical_paths/change_management/: { content: RECORD, handling: APPEND_ONLY }  # 418 law-mandated deploy ledgers (stage-D cycle-1 finding)
  # infra
  infra/:                           { content: CODE,        handling: SCORE }
  infra/system/ontology/:           { content: REGISTRY,    handling: SCORE }
  # data -- FIRM FENCE: no cohort spans bd/cot/inf
  data/:                            { content: DATA,        handling: SCORE }
  # docs
  docs/:                            { content: WORKPRODUCT, handling: SCORE }
  docs/doctrine/:                   { content: DOCTRINE,    handling: PROTECT }
  docs/references/:                 { content: RECORD,      handling: APPEND_ONLY }
  docs/architecture/:               { content: REGISTRY,    handling: SCORE }
  # protected cores + misc roots
  .tools/:                          { content: CODE,        handling: PROTECT }
  .claude/:                         { content: CODE,        handling: PROTECT }
  memory/:                          { content: DOCTRINE,    handling: PROTECT }
  rcg/:                             { content: REGISTRY,    handling: SCORE }
  portal/:                          { content: MIXED,       handling: EXCLUDE }
  tools/tax_sma/:                   { content: CODE,        handling: SCORE }   # measured live (cycle-0)
  tools/:                           { content: WORKPRODUCT, handling: SCORE }   # residual; orphan-root evidence lives in features
  deck_generation/:                 { content: WORKPRODUCT, handling: SCORE }
  research_transcripts/:            { content: REGISTRY,    handling: SCORE }
  timeseries/:                      { content: DATA,        handling: SCORE }
  research/:                        { content: WORKPRODUCT, handling: SCORE }
  models/:                          { content: WORKPRODUCT, handling: SCORE }
  users/:                           { content: WORKPRODUCT, handling: SCORE }
  workflows/:                       { content: WORKPRODUCT, handling: SCORE }
  etf_netassets_watch/:             { content: WORKPRODUCT, handling: SCORE }
  tests/:                           { content: CODE,        handling: SCORE }
  lib/:                             { content: CODE,        handling: SCORE }
  security/:                        { content: REGISTRY,    handling: SCORE }
  design/:                          { content: WORKPRODUCT, handling: SCORE }
  .github/:                         { content: CODE,        handling: SCORE }
  CLAUDE.md:                        { content: DOCTRINE,    handling: PROTECT }
  "*":                              { content: REGISTRY,    handling: SCORE }   # root-level files
